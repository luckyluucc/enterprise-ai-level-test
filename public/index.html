<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>老板 AI 化诊断 · 你自己会用，为什么团队推不动？</title>
  <meta name="description" content="30 人以下企业老板专属。5 分钟定位你在 L1-L5 哪个阶段，AI 出个性化诊断书。自然流 · AI 实战派 出品。">

  <style>
    /* ===== lulumoney brand tokens ===== */
    :root {
      --primary: #1E88E5;
      --primary-light: #64B5F6;
      --primary-dark: #1565C0;
      --accent: #FDB813;
      --accent-light: #FFD54F;

      --gray: #8892B0;
      --light: #F5F7FA;
      --white: #FFFFFF;
      --dark-gray: #4A5568;
      --text: #2D3748;
      --text-soft: #5A6577;

      --warning: #E53E3E;
      --success: #38A169;
      --border: #E2E8F0;
      --border-soft: #EDF2F7;

      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, system-ui, sans-serif;
      --font-mono: "SF Mono", "Monaco", "Menlo", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: var(--font-sans);
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      font-size: 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 22px 90px;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 24px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 32px;
    }

    .brand {
      font-size: 15px;
      font-weight: 600;
      color: var(--dark-gray);
      letter-spacing: -0.2px;
    }

    .brand-prefix {
      color: var(--gray);
      font-weight: 400;
    }

    .brand-dot {
      color: var(--primary);
      margin: 0 6px;
    }

    .doc-no {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 1.5px;
    }

    /* ===== Progress ===== */
    .progress-wrap { margin-bottom: 28px; }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 4px;
      background: var(--border-soft);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      width: 0%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== Card ===== */
    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: rgba(0, 0, 0, 0.04) 0px 4px 24px;
      animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Cover ===== */
    .cover-tag {
      display: inline-block;
      background: rgba(30, 136, 229, 0.08);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    h1.cover-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }

    h1.cover-title .highlight {
      color: var(--primary);
    }

    .cover-sub {
      font-size: 16px;
      color: var(--text-soft);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .cover-sub strong {
      color: var(--primary-dark);
      font-weight: 600;
    }

    .cover-points {
      background: var(--light);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 28px;
    }

    .cover-points-title {
      font-size: 12px;
      color: var(--gray);
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .cover-points ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .cover-points li {
      padding-left: 22px;
      position: relative;
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 6px;
    }

    .cover-points li:last-child { margin-bottom: 0; }

    .cover-points li::before {
      content: '✓';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--primary);
      font-weight: 700;
    }

    .cover-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      margin: 0 -4px 32px;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
    }

    .meta-item {
      padding: 18px 12px;
      text-align: center;
      border-right: 1px solid var(--border-soft);
    }

    .meta-item:last-child { border-right: none; }

    .meta-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .meta-label {
      font-size: 12px;
      color: var(--gray);
      margin-top: 6px;
      letter-spacing: 0.3px;
    }

    /* ===== Question ===== */
    .q-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .q-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--white);
      background: var(--primary);
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .q-part {
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .q-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      letter-spacing: -0.2px;
      margin-bottom: 10px;
    }

    .q-optional {
      font-size: 13px;
      font-weight: 400;
      color: var(--gray);
      letter-spacing: 0;
    }

    .q-hint {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.65;
      margin-bottom: 26px;
      padding-left: 14px;
      border-left: 3px solid var(--accent);
    }

    /* ===== Options ===== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 15px 18px;
      background: var(--light);
      border: 2px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 15px;
      color: var(--text);
      user-select: none;
    }

    .option:hover {
      background: rgba(30, 136, 229, 0.05);
      border-color: var(--primary-light);
    }

    .option.selected {
      background: rgba(30, 136, 229, 0.08);
      border-color: var(--primary);
      color: var(--primary-dark);
      font-weight: 500;
    }

    .option-mark {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      margin-right: 14px;
      flex-shrink: 0;
      position: relative;
      transition: all 0.15s ease;
    }

    .option.selected .option-mark {
      border-color: var(--primary);
      background: var(--primary);
    }

    .option.selected .option-mark::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background: var(--white);
      border-radius: 50%;
    }

    .option-multi .option-mark { border-radius: 5px; }
    .option-multi.selected .option-mark::after {
      content: '✓';
      color: var(--white);
      background: transparent;
      width: auto; height: auto;
      font-size: 13px;
      font-weight: 700;
    }

    /* ===== Inputs ===== */
    input[type="text"], select, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: rgba(30, 136, 229, 0.12) 0 0 0 3px;
    }

    select {
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238892B0' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 40px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.65;
    }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: var(--gray);
      margin-top: 6px;
      font-family: var(--font-mono);
    }

    .field-group { margin-bottom: 28px; }

    /* ===== Buttons ===== */
    .nav-buttons { display: flex; gap: 12px; margin-top: 8px; }

    .btn {
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      font-family: inherit;
      flex: 1;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: rgba(30, 136, 229, 0.25) 0 6px 14px;
    }

    .btn-primary:disabled {
      background: var(--border);
      color: var(--gray);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: var(--white);
      color: var(--dark-gray);
      border: 1.5px solid var(--border);
      flex: 0 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-large {
      width: 100%;
      padding: 16px 24px;
      font-size: 16px;
    }

    .btn-accent {
      background: var(--accent);
      color: var(--text);
    }

    .btn-accent:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
      box-shadow: rgba(253, 184, 19, 0.3) 0 6px 14px;
    }

    /* ===== Loading ===== */
    .loading-state { text-align: center; padding: 60px 20px 50px; }

    .spinner {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border: 4px solid var(--border-soft);
      border-top-color: var(--primary);
      border-right-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .loading-step {
      font-size: 13px;
      color: var(--primary);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* ===== Result ===== */
    .result-header {
      text-align: center;
      padding: 8px 0 28px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 28px;
    }

    .result-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--white);
      padding: 7px 18px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.2px;
      margin-bottom: 18px;
    }

    .result-level-num {
      font-size: 64px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 8px;
      font-family: var(--font-mono);
    }

    .result-level-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }

    .result-level-tagline {
      font-size: 14px;
      color: var(--text-soft);
    }

    .result-content {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
    }

    .result-content h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin: 28px 0 12px;
      padding-left: 12px;
      border-left: 4px solid var(--primary);
    }

    .result-content h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 22px 0 10px;
    }

    .result-content p { margin-bottom: 12px; color: var(--dark-gray); }

    .result-content ol, .result-content ul { margin: 8px 0 14px 22px; color: var(--dark-gray); }

    .result-content li { margin-bottom: 8px; }

    .result-content strong {
      color: var(--primary-dark);
      font-weight: 600;
      background: rgba(253, 184, 19, 0.18);
      padding: 0 4px;
      border-radius: 3px;
    }

    .result-footer {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--border-soft);
    }

    /* ===== CTA box ===== */
    .cta-box {
      background: linear-gradient(135deg, rgba(30, 136, 229, 0.04), rgba(253, 184, 19, 0.06));
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 28px 26px;
      margin-bottom: 20px;
    }

    .cta-tag {
      display: inline-block;
      background: var(--accent);
      color: var(--text);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .cta-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      line-height: 1.4;
      letter-spacing: -0.2px;
    }

    .cta-text {
      font-size: 14.5px;
      color: var(--dark-gray);
      line-height: 1.75;
      margin-bottom: 12px;
    }

    .cta-text strong {
      color: var(--primary-dark);
      font-weight: 600;
    }

    .cta-text:last-of-type { margin-bottom: 18px; }

    .cta-qr-wrap {
      background: var(--white);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .cta-qr-img {
      width: 180px;
      height: 180px;
      border-radius: 10px;
      object-fit: cover;
    }

    .cta-qr-info {
      text-align: center;
    }

    .cta-qr-info .wechat-label {
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .cta-qr-info .wechat-id {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      font-family: var(--font-mono);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .cta-qr-info .wechat-hint {
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    /* ===== 4 板块能力图 ===== */
    .domain-wrap {
      background: var(--light);
      border-radius: 12px;
      padding: 20px 22px;
      margin: 20px 0 28px;
    }

    .domain-wrap-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .domain-wrap-title .domain-wrap-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--gray);
      margin-left: 8px;
    }

    .domain-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .domain-row:last-child { margin-bottom: 0; }

    .domain-label {
      font-size: 13px;
      color: var(--dark-gray);
      width: 70px;
      flex-shrink: 0;
    }

    .domain-bar {
      flex: 1;
      height: 10px;
      background: var(--border-soft);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .domain-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 5px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .domain-bar-fill.weak {
      background: linear-gradient(90deg, #E2E8F0, #CBD5E0);
    }
    .domain-bar-fill.medium {
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
    }
    .domain-bar-fill.strong {
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
    }
    .domain-bar-fill.excellent {
      background: linear-gradient(90deg, var(--success), #4FD1C5);
    }

    .domain-score {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      width: 42px;
      text-align: right;
      flex-shrink: 0;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--gray);
      margin-top: 32px;
      line-height: 1.7;
      letter-spacing: 0.2px;
    }

    .footer-note strong {
      color: var(--dark-gray);
      font-weight: 600;
    }

    /* ===== Error ===== */
    .error-banner {
      background: rgba(229, 62, 62, 0.08);
      border-left: 3px solid var(--warning);
      padding: 14px 18px;
      border-radius: 6px;
      color: var(--warning);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .hidden { display: none !important; }

    @media (max-width: 540px) {
      .container { padding: 22px 16px 70px; }
      .card { padding: 28px 20px; border-radius: 14px; }
      h1.cover-title { font-size: 26px; }
      .cover-sub { font-size: 15px; }
      .meta-num { font-size: 22px; }
      .q-title { font-size: 19px; }
      .result-level-num { font-size: 50px; }
      .result-level-name { font-size: 20px; }
      .cta-qr-wrap { flex-direction: column; text-align: center; }
      .cta-qr-info .wechat-hint { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="header">
      <div class="brand"><span class="brand-prefix">自然流</span><span class="brand-dot">·</span>AI 实战派</div>
      <div class="doc-no">№ 001 / 2026</div>
    </header>

    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-meta">
        <span id="progressLabel">第 1 题 / 共 20 题</span>
        <span id="progressPercent">5%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <main id="app"></main>

    <div class="footer-note">
      <p>测评由 <strong>自然流 · AI 实战派</strong> 出品</p>
    </div>

  </div>

  <script>
    // ===== Question Schema (17 题, v3) =====
    // 框架：老板 AI 化 5 阶段（L1-L5）；4 板块能力（个人/团队/组织/系统）
    // 等级算法：B 区 4 道 × 6 档（0-5 分）累加 → L1-L5 + 交叉校验降级，防止乱选最高档
    const questions = [
      // Part A — 基础信息
      { id:'A1', part:'A', type:'text', title:'怎么称呼你？',
        hint:'随便填，不会公开。', placeholder:'例如：小璐', required:true },
      { id:'A2', part:'A', type:'select', title:'你所在的行业？',
        options:['内容/自媒体','电商/零售','教育/培训','咨询/服务','制造业','建筑/工程','互联网/科技','金融','医疗/健康','餐饮/快消','本地生活/服务','其他'],
        required:true },
      { id:'A3', part:'A', type:'select', title:'公司规模？',
        hint:'按 PDF《30 人以下企业 AI 转型实战指南》的分层，规模决定协调成本。',
        options:['1 人（独立创业者）','2-9 人（小团队）','10-30 人（小公司）','30-50 人','50-150 人','150+ 人'],
        required:true },

      // Part B — 阶段定位（4 题 6 档单选）—— 每档对应 0-5 分，累加 → L1-L5
      { id:'B1', part:'B', type:'single', title:'上周你自己用 AI 完成了几件具体工作交付？',
        hint:'"具体交付"指拿出可用产出——一篇推文、一份方案、一段代码、一个客户回复，不是聊聊试试。',
        options:[
          '0 件，主要是看新闻、刷推文',
          '1-2 件，偶尔试一下',
          '3-5 件，几个稳定场景在用',

    // ===== Render: Question =====
    function renderQuestion() {
      const q = questions[state.step];
      const total = questions.length;
      progressWrap.classList.remove('hidden');
      const pct = Math.round(((state.step + 1) / total) * 100);
      progressFill.style.width = pct + '%';
      progressLabel.textContent = `第 ${state.step + 1} 题 / 共 ${total} 题 · Part ${q.part}`;
      progressPercent.textContent = pct + '%';

      let body = '';
      const cur = state.answers[q.id];

      if (q.type === 'text') {
        body = `<div class="field-group">
          <input type="text" id="qInput" placeholder="${q.placeholder || ''}" value="${cur || ''}" oninput="onTextChange(this.value)" maxlength="40">
        </div>`;
      } else if (q.type === 'select') {
        body = `<div class="field-group">
          <select id="qInput" onchange="onTextChange(this.value)">
            <option value="">请选择...</option>
            ${q.options.map(opt => `<option value="${opt}" ${cur===opt?'selected':''}>${opt}</option>`).join('')}
          </select>
        </div>`;
      } else if (q.type === 'yesno') {
        body = `<div class="options">
          <div class="option ${cur==='是'?'selected':''}" onclick="selectOption('是')">
            <div class="option-mark"></div><span>是</span>
          </div>
          <div class="option ${cur==='否'?'selected':''}" onclick="selectOption('否')">
            <div class="option-mark"></div><span>否</span>
          </div>
        </div>`;
      } else if (q.type === 'single') {
        body = `<div class="options">
          ${q.options.map(opt => `
            <div class="option ${cur===opt?'selected':''}" onclick="selectOption('${opt.replace(/'/g,"\\'")}')">
              <div class="option-mark"></div><span>${opt}</span>
            </div>
          `).join('')}
        </div>`;
      } else if (q.type === 'multi') {
        const arr = cur || [];
        body = `<div class="options">
          ${q.options.map(opt => `
            <div class="option option-multi ${arr.includes(opt)?'selected':''}" onclick="toggleMulti('${opt.replace(/'/g,"\\'")}')">
              <div class="option-mark"></div><span>${opt}</span>
            </div>
          `).join('')}
        </div>`;
      } else if (q.type === 'textarea') {
        const val = cur || '';
        body = `<div class="field-group">
          <textarea id="qInput" placeholder="${q.placeholder || ''}" maxlength="${q.maxLen || 500}" oninput="onTextChange(this.value); updateCount(this.value.length, ${q.maxLen || 500})">${val}</textarea>
          <div class="char-count" id="charCount">${val.length} / ${q.maxLen || 500}</div>
        </div>`;
      }

      const isLast = state.step === total - 1;
      const nextLabel = isLast ? '提交并生成诊断书 →' : '下一题 →';
      const optionalTag = q.required === false ? '<span class="q-optional"> · 选填</span>' : '';

      app.innerHTML = `
        <div class="card">
          <div class="q-meta">
            <span class="q-id">${q.id}</span>
            <span class="q-part">Part ${q.part}</span>
          </div>
          <div class="q-title">${q.title}${optionalTag}</div>
          ${q.hint ? `<div class="q-hint">${q.hint}</div>` : ''}
          ${body}
          <div class="nav-buttons">
            ${state.step > 0 ? `<button class="btn btn-secondary" onclick="prev()">← 上一题</button>` : ''}
            <button class="btn btn-primary" id="nextBtn" onclick="next()" ${isValidAnswer(q)?'':'disabled'}>${nextLabel}</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        const inp = document.getElementById('qInput');
        if (inp && (q.type==='text' || q.type==='textarea')) inp.focus();
      }, 60);
    }

    }

    // ===== Render: 4 板块能力图 =====
    function renderDomainBars(domains) {
      if (!domains) return '';
      const rows = [
        { key:'personal', label:'个人能力' },
        { key:'team',     label:'团队渗透' },
        { key:'org',      label:'组织重构' },
        { key:'system',   label:'系统沉淀' },
      ];
      const classify = (s) => s < 25 ? 'weak' : s < 50 ? 'medium' : s < 75 ? 'strong' : 'excellent';
      const body = rows.map(r => {
        const s = Math.max(0, Math.min(100, Math.round(domains[r.key] ?? 0)));
        return `
          <div class="domain-row">
            <span class="domain-label">${r.label}</span>
            <div class="domain-bar"><div class="domain-bar-fill ${classify(s)}" style="width:${s}%"></div></div>
            <span class="domain-score">${s}</span>
          </div>
        `;
      }).join('');
      return `
        <div class="domain-wrap">
          <div class="domain-wrap-title">4 板块能力分布<span class="domain-wrap-sub">满分 100</span></div>
          ${body}
        </div>
      `;
    }

              <span class="cta-tag">📘 免费领取</span>
              <div class="cta-title">把这份诊断截图发我，<br/>送你《30 人以下企业 AI 转型实战指南》</div>
              <div class="cta-text">49 页 · 6 个部分 · 18 个实战动作。不讲工具评测，讲 <strong>30 人以下团队怎么真的把 AI 跑起来</strong>——L1-L5 定位、3 个最贵的认知误区、六步走路线图、降到零学习成本的 3 种方法、内容/销售/知识/流程 4 个动作库。</div>
              <div class="cta-text">这本指南是我们团队 + 18 个客户 <strong>真金白银踩出来的</strong>，不是道听途说。把你这份诊断截图发我，<strong>送你完整版 PDF + 基于你具体情况的 1 条关键建议</strong>。</div>

              <div class="cta-qr-wrap">
                <img class="cta-qr-img" src="/qrcode.jpg" alt="卿小璐微信" loading="lazy">
                <div class="cta-qr-info">
                  <div class="wechat-label">微信号</div>
                  <div class="wechat-id">qingxiaoluu</div>
                  <div class="wechat-hint">扫码加我，备注「AI 测评」</div>
                </div>
              </div>
            </div>
            <div class="result-actions">
              <button class="btn btn-primary" onclick="restart()">重新测一遍</button>
              <button class="btn btn-secondary" onclick="copyResult()">复制全文</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderError(msg) {
      progressWrap.classList.add('hidden');
      app.innerHTML = `
        <div class="card">
          <div class="error-banner">${msg}</div>
          <p style="color:var(--text-soft);font-size:14px;margin-bottom:24px;">你的答题数据还在，可以再试一次。如果反复出错，加微信 <strong>qingxiaoluu</strong> 反馈。</p>
          <button class="btn btn-primary btn-large" onclick="submit()">重试生成诊断书</button>
        </div>
      `;
    }

    // ===== Handlers =====
    window.next = function() {
      if (state.step === -1) { state.step = 0; renderQuestion(); return; }
      const q = questions[state.step];
      if (!isValidAnswer(q)) return;
      if (state.step === questions.length - 1) { submit(); }
      else { state.step++; renderQuestion(); }
    };

    window.prev = function() {
      if (state.step > 0) { state.step--; renderQuestion(); }
    };

    window.onTextChange = function(val) {
      const q = questions[state.step];
      state.answers[q.id] = val;
      const btn = document.getElementById('nextBtn');
      if (btn) btn.disabled = !isValidAnswer(q);
    };

    window.updateCount = function(n, max) {
      const el = document.getElementById('charCount');
      if (el) el.textContent = `${n} / ${max}`;
    };

    window.selectOption = function(val) {
      const q = questions[state.step];
      state.answers[q.id] = val;
      if (q.type === 'yesno' || q.type === 'single') {
        setTimeout(() => {
          if (state.step === questions.length - 1) renderQuestion();
          else { state.step++; renderQuestion(); }
        }, 240);
      } else {
        renderQuestion();
      }
    };

    window.toggleMulti = function(val) {
      const q = questions[state.step];
      const arr = state.answers[q.id] || [];
      const i = arr.indexOf(val);
      if (i >= 0) arr.splice(i, 1); else arr.push(val);
      state.answers[q.id] = arr;
      renderQuestion();
    };

    function isValidAnswer(q) {
      const v = state.answers[q.id];
      if (q.required === false) return true;
      if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
      if (q.type === 'textarea') return typeof v === 'string' && v.trim().length >= 5;
      return v !== undefined && v !== null && (typeof v !== 'string' || v.trim().length > 0);
    }

    window.submit = async function() {
      state.step = questions.length;
      let idx = 0;
      renderLoading(0);
      const intv = setInterval(() => { idx++; renderLoading(idx); }, 3500);
      try {
        const resp = await fetch('/api/diagnose', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ answers: state.answers })
        });
        clearInterval(intv);
        if (!resp.ok) {
          const errText = await resp.text();
          throw new Error(`服务返回 ${resp.status}：${errText.slice(0,160)}`);
        }
        const data = await resp.json();
        state.result = data;
        state.step = questions.length + 1;
        renderResult();
      } catch (e) {
        clearInterval(intv);
        renderError('生成诊断书时出了点问题：' + (e.message || '未知错误'));
      }
    };

    window.restart = function() {
      state.step = -1; state.answers = {}; state.result = null;
      renderWelcome();
    };

    window.copyResult = function() {
      const r = state.result;
      const tmp = document.createElement('div');
      tmp.innerHTML = r.html;
      const text = `【老板 AI 化诊断书】\n\nL${r.level} · ${r.levelName}\n${r.tagline||''}\n\n${tmp.innerText}\n\n— 自然流 · AI 实战派\n微信：qingxiaoluu`;
      navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板'));
    };

    renderWelcome();
  </script>
</body>
</html>
