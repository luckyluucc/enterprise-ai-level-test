<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>企业 AI 原生化诊断 · 你公司在 AI 哪一级？</title>
  <meta name="description" content="60 秒测出你公司的 AI 化水平，AI 出个性化诊断书。自然流 · 卿小璐 出品。">

  <style>
    /* ===== lulumoney brand tokens ===== */
    :root {
      --primary: #1E88E5;
      --primary-light: #64B5F6;
      --primary-dark: #1565C0;
      --accent: #FDB813;
      --accent-light: #FFD54F;

      --gray: #8892B0;
      --light: #F5F7FA;
      --white: #FFFFFF;
      --dark-gray: #4A5568;
      --text: #2D3748;
      --text-soft: #5A6577;

      --warning: #E53E3E;
      --success: #38A169;
      --border: #E2E8F0;
      --border-soft: #EDF2F7;

      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, system-ui, sans-serif;
      --font-mono: "SF Mono", "Monaco", "Menlo", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: var(--font-sans);
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      font-size: 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 22px 90px;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 24px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 32px;
    }

    .brand {
      font-size: 15px;
      font-weight: 600;
      color: var(--dark-gray);
      letter-spacing: -0.2px;
    }

    .brand-prefix {
      color: var(--gray);
      font-weight: 400;
    }

    .brand-dot {
      color: var(--primary);
      margin: 0 6px;
    }

    .doc-no {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 1.5px;
    }

    /* ===== Progress ===== */
    .progress-wrap { margin-bottom: 28px; }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 4px;
      background: var(--border-soft);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      width: 0%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== Card ===== */
    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: rgba(0, 0, 0, 0.04) 0px 4px 24px;
      animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Cover ===== */
    .cover-tag {
      display: inline-block;
      background: rgba(30, 136, 229, 0.08);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    h1.cover-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }

    h1.cover-title .highlight {
      color: var(--primary);
    }

    .cover-sub {
      font-size: 16px;
      color: var(--text-soft);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .cover-sub strong {
      color: var(--primary-dark);
      font-weight: 600;
    }

    .cover-points {
      background: var(--light);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 28px;
    }

    .cover-points-title {
      font-size: 12px;
      color: var(--gray);
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .cover-points ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .cover-points li {
      padding-left: 22px;
      position: relative;
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 6px;
    }

    .cover-points li:last-child { margin-bottom: 0; }

    .cover-points li::before {
      content: '✓';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--primary);
      font-weight: 700;
    }

    .cover-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      margin: 0 -4px 32px;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
    }

    .meta-item {
      padding: 18px 12px;
      text-align: center;
      border-right: 1px solid var(--border-soft);
    }

    .meta-item:last-child { border-right: none; }

    .meta-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .meta-label {
      font-size: 12px;
      color: var(--gray);
      margin-top: 6px;
      letter-spacing: 0.3px;
    }

    /* ===== Question ===== */
    .q-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .q-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--white);
      background: var(--primary);
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .q-part {
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .q-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      letter-spacing: -0.2px;
      margin-bottom: 10px;
    }

    .q-optional {
      font-size: 13px;
      font-weight: 400;
      color: var(--gray);
      letter-spacing: 0;
    }

    .q-hint {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.65;
      margin-bottom: 26px;
      padding-left: 14px;
      border-left: 3px solid var(--accent);
    }

    /* ===== Options ===== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 15px 18px;
      background: var(--light);
      border: 2px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 15px;
      color: var(--text);
      user-select: none;
    }

    .option:hover {
      background: rgba(30, 136, 229, 0.05);
      border-color: var(--primary-light);
    }

    .option.selected {
      background: rgba(30, 136, 229, 0.08);
      border-color: var(--primary);
      color: var(--primary-dark);
      font-weight: 500;
    }

    .option-mark {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      margin-right: 14px;
      flex-shrink: 0;
      position: relative;
      transition: all 0.15s ease;
    }

    .option.selected .option-mark {
      border-color: var(--primary);
      background: var(--primary);
    }

    .option.selected .option-mark::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background: var(--white);
      border-radius: 50%;
    }

    .option-multi .option-mark { border-radius: 5px; }
    .option-multi.selected .option-mark::after {
      content: '✓';
      color: var(--white);
      background: transparent;
      width: auto; height: auto;
      font-size: 13px;
      font-weight: 700;
    }

    /* ===== Inputs ===== */
    input[type="text"], select, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: rgba(30, 136, 229, 0.12) 0 0 0 3px;
    }

    select {
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238892B0' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 40px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.65;
    }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: var(--gray);
      margin-top: 6px;
      font-family: var(--font-mono);
    }

    .field-group { margin-bottom: 28px; }

    /* ===== Buttons ===== */
    .nav-buttons { display: flex; gap: 12px; margin-top: 8px; }

    .btn {
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      font-family: inherit;
      flex: 1;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: rgba(30, 136, 229, 0.25) 0 6px 14px;
    }

    .btn-primary:disabled {
      background: var(--border);
      color: var(--gray);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: var(--white);
      color: var(--dark-gray);
      border: 1.5px solid var(--border);
      flex: 0 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-large {
      width: 100%;
      padding: 16px 24px;
      font-size: 16px;
    }

    .btn-accent {
      background: var(--accent);
      color: var(--text);
    }

    .btn-accent:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
      box-shadow: rgba(253, 184, 19, 0.3) 0 6px 14px;
    }

    /* ===== Loading ===== */
    .loading-state { text-align: center; padding: 60px 20px 50px; }

    .spinner {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border: 4px solid var(--border-soft);
      border-top-color: var(--primary);
      border-right-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .loading-step {
      font-size: 13px;
      color: var(--primary);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* ===== Result ===== */
    .result-header {
      text-align: center;
      padding: 8px 0 28px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 28px;
    }

    .result-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--white);
      padding: 7px 18px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.2px;
      margin-bottom: 18px;
    }

    .result-level-num {
      font-size: 64px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 8px;
      font-family: var(--font-mono);
    }

    .result-level-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }

    .result-level-tagline {
      font-size: 14px;
      color: var(--text-soft);
    }

    .result-content {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
    }

    .result-content h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin: 28px 0 12px;
      padding-left: 12px;
      border-left: 4px solid var(--primary);
    }

    .result-content h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 22px 0 10px;
    }

    .result-content p { margin-bottom: 12px; color: var(--dark-gray); }

    .result-content ol, .result-content ul { margin: 8px 0 14px 22px; color: var(--dark-gray); }

    .result-content li { margin-bottom: 8px; }

    .result-content strong {
      color: var(--primary-dark);
      font-weight: 600;
      background: rgba(253, 184, 19, 0.18);
      padding: 0 4px;
      border-radius: 3px;
    }

    .result-footer {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--border-soft);
    }

    /* ===== CTA box ===== */
    .cta-box {
      background: linear-gradient(135deg, rgba(30, 136, 229, 0.04), rgba(253, 184, 19, 0.06));
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 28px 26px;
      margin-bottom: 20px;
    }

    .cta-tag {
      display: inline-block;
      background: var(--accent);
      color: var(--text);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .cta-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      line-height: 1.4;
      letter-spacing: -0.2px;
    }

    .cta-text {
      font-size: 14.5px;
      color: var(--dark-gray);
      line-height: 1.75;
      margin-bottom: 12px;
    }

    .cta-text strong {
      color: var(--primary-dark);
      font-weight: 600;
    }

    .cta-text:last-of-type { margin-bottom: 18px; }

    .cta-qr-wrap {
      background: var(--white);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cta-qr-img {
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      border-radius: 8px;
      object-fit: cover;
    }

    .cta-qr-info {
      flex: 1;
      min-width: 0;
    }

    .cta-qr-info .wechat-label {
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .cta-qr-info .wechat-id {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      font-family: var(--font-mono);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .cta-qr-info .wechat-hint {
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--gray);
      margin-top: 32px;
      line-height: 1.7;
      letter-spacing: 0.2px;
    }

    .footer-note strong {
      color: var(--dark-gray);
      font-weight: 600;
    }

    /* ===== Error ===== */
    .error-banner {
      background: rgba(229, 62, 62, 0.08);
      border-left: 3px solid var(--warning);
      padding: 14px 18px;
      border-radius: 6px;
      color: var(--warning);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .hidden { display: none !important; }

    @media (max-width: 540px) {
      .container { padding: 22px 16px 70px; }
      .card { padding: 28px 20px; border-radius: 14px; }
      h1.cover-title { font-size: 26px; }
      .cover-sub { font-size: 15px; }
      .meta-num { font-size: 22px; }
      .q-title { font-size: 19px; }
      .result-level-num { font-size: 50px; }
      .result-level-name { font-size: 20px; }
      .cta-qr-wrap { flex-direction: column; text-align: center; }
      .cta-qr-info .wechat-hint { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="header">
      <div class="brand"><span class="brand-prefix">自然流</span><span class="brand-dot">·</span>卿小璐</div>
      <div class="doc-no">№ 001 / 2026</div>
    </header>

    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-meta">
        <span id="progressLabel">第 1 题 / 共 20 题</span>
        <span id="progressPercent">5%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <main id="app"></main>

    <div class="footer-note">
      <p>测评由 <strong>自然流 · 卿小璐</strong> 出品</p>
    </div>

  </div>

  <script>
    // ===== Question Schema (20 题) =====
    const questions = [
      // Part A — 基础信息
      { id:'A1', part:'A', type:'text', title:'怎么称呼你？',
        hint:'随便填，不会公开。', placeholder:'例如：小璐', required:true },
      { id:'A2', part:'A', type:'select', title:'你所在的行业？',
        options:['内容/自媒体','电商/零售','教育/培训','咨询/服务','制造业','建筑/工程','互联网/科技','金融','医疗/健康','餐饮/快消','其他'],
        required:true },
      { id:'A3', part:'A', type:'select', title:'公司规模？',
        options:['独立创业者（1 人）','小团队（2-5 人）','小公司（6-20 人）','中型（21-100 人）','大型（101-500 人）','大企业（500+ 人）'],
        required:true },

      // Part B — 等级定位（10 道是/否，递进）
      { id:'B1', part:'B', type:'yesno', title:'过去一周，公司里至少有一个人（包括你自己）用 AI 完成了一件具体的工作？',
        hint:'真实写过 / 用过，不是"听说"或"刷过推文"。' },
      { id:'B2', part:'B', type:'yesno', title:'公司在正式场合（例会 / 周报 / 全员信）讨论过"用 AI 做某事"？',
        hint:'是公开议题，不是私下聊。' },
      { id:'B3', part:'B', type:'yesno', title:'公司至少部署了 1 个 AI 工具（Copilot / 自建账号 / 企业版订阅）？',
        hint:'是公司买的，不只是某个人自己掏钱订阅。' },
      { id:'B4', part:'B', type:'yesno', title:'有至少一个部门在用这个工具，月活率超过 50%？',
        hint:'不是 IT 报喜的覆盖率，是真实使用率。' },
      { id:'B5', part:'B', type:'yesno', title:'公司至少有 2 个部门各自跑通了 AI 工作流，且效率提升可量化？',
        hint:'比如"客服响应时长降 40%""内容产量翻 3 倍"这种。' },
      { id:'B6', part:'B', type:'yesno', title:'公司有专人 / 专岗负责 AI 基础设施（知识库 / Prompt 库 / Skill 库），不是兼任？',
        hint:'这个人的 KPI 是"让别人更快用 AI"，不是自己用得最厉害。' },
      { id:'B7', part:'B', type:'yesno', title:'最近 3 个月，公司调整过岗位说明书或合并过岗位，原因是"AI 接管了一部分工作"？',
        hint:'真的改了 JD 或减/并了岗位，不是只在脑子里想。' },
      { id:'B8', part:'B', type:'yesno', title:'如果今天把所有 AI 工具撤掉，公司的产品形态 / 服务方式 / 收费模式会变样？',
        hint:'不是"会变难做"，是"产品本身长得不一样"。' },
      { id:'B9', part:'B', type:'yesno', title:'公司实际员工数 ≤ 5 人，但承担了传统 30+ 人的业务量？',
        hint:'真的小团队大产出，不是外包/兼职凑数。' },
      { id:'B10', part:'B', type:'yesno', title:'公司从注册第一天起就是按 AI-native 设计的，没有"AI 化"这个动作？',
        hint:'从 0 设计就是 AI 原生，不是后期改造。' },

      // Part C — 多维补充
      { id:'C1', part:'C', type:'multi', title:'公司里用过哪些 AI 工具？',
        hint:'多选，包括个人订阅 + 公司部署。',
        options:['ChatGPT','Claude','豆包','Kimi','DeepSeek','文心一言','元宝','Copilot','Cursor','Coze','Dify','MidJourney','Sora','即梦','其他','都没用过'] },
      { id:'C2', part:'C', type:'multi', title:'AI 已经嵌入哪些业务环节？',
        hint:'多选。"嵌入"指流程的一部分，不是偶尔用一下。',
        options:['写文章 / 内容','客服','招聘 / HR','数据分析','编程 / 开发','设计 / 出图','财务','销售','产品 / 研发','培训','其他','都没嵌入'] },
      { id:'C3', part:'C', type:'single', title:'老板个人 AI 水平 vs 公司整体？',
        hint:'诚实回答，这是诊断"内外差"的关键。',
        options:['差不多','老板略高一些','老板明显高出一截','天差地别（老板单飞）','老板还不如员工'] },

      // Part D — 开放题（5 道）
      { id:'D1', part:'D', type:'textarea', title:'你公司用 AI 最大的卡点是什么？',
        hint:'越具体越好——AI 会基于这条给你"个性化诊断"。例如："员工觉得 AI 不靠谱，让他用他就糊弄。"',
        placeholder:'200 字内，越具体越好', required:true, maxLen:200 },
      { id:'D2', part:'D', type:'textarea', title:'未来 3-6 个月，你最想用 AI 解决的具体业务问题？',
        hint:'比如："把公众号内容产量从月 4 篇提到月 20 篇""客服响应时间砍一半""自动出销售线索"。越具体，诊断越能给你可执行的路径。',
        placeholder:'200 字内', required:true, maxLen:200 },
      { id:'D3', part:'D', type:'textarea', title:'在 AI 落地的过程中，你或你的团队踩过什么坑？',
        hint:'选填。说说你们试过什么、为什么失败——这能让 AI 避免给你重复的建议。',
        placeholder:'选填，200 字内', required:false, maxLen:200 },
      { id:'D4', part:'D', type:'textarea', title:'你公司里"最适合先开始用 AI"的人 / 部门是谁？',
        hint:'选填。如果你心里已经有人选，写出来。AI 会基于这个给你"启动顺序"建议。',
        placeholder:'选填，200 字内', required:false, maxLen:200 },
      { id:'D5', part:'D', type:'textarea', title:'你最想从这份诊断书里得到什么具体建议？',
        hint:'选填。比如"下一季度该投谁去学 AI""哪个部门先动手""怎么说服老板加预算"。',
        placeholder:'选填，200 字内', required:false, maxLen:200 },
    ];

    // ===== State =====
    const state = { step: -1, answers: {}, result: null };
    const app = document.getElementById('app');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const progressPercent = document.getElementById('progressPercent');

    // ===== Render: Welcome =====
    function renderWelcome() {
      progressWrap.classList.add('hidden');
      app.innerHTML = `
        <div class="card">
          <span class="cover-tag">企业 AI 原生化诊断 · 免费</span>
          <h1 class="cover-title">你公司在 AI 哪一级？<br/><span class="highlight">95% 的公司，卡在同一个地方。</span></h1>
          <p class="cover-sub">10 分钟，测出你公司的 AI 化等级。<br/>测完拿到一份 <strong>专属于你的诊断书</strong>——等级判定、最大卡点、可执行的 3 个动作。</p>

          <div class="cover-points">
            <div class="cover-points-title">这份诊断书会告诉你</div>
            <ul>
              <li>你公司目前在 AI 化的哪一级（11 级体系）</li>
              <li>跟你同行业 / 同规模的公司比，你是领先还是落后</li>
              <li>下一级最难跨的那道坎，具体是什么</li>
              <li>未来 3 个月，你应该先动哪个部门</li>
              <li>测完可领取《企业 AI 化改造白皮书》</li>
            </ul>
          </div>

          <div class="cover-meta">
            <div class="meta-item"><div class="meta-num">${questions.length}</div><div class="meta-label">道题</div></div>
            <div class="meta-item"><div class="meta-num">10</div><div class="meta-label">分钟</div></div>
            <div class="meta-item"><div class="meta-num">11</div><div class="meta-label">等级判定</div></div>
          </div>

          <button class="btn btn-primary btn-large" onclick="next()">开始诊断 →</button>
        </div>
      `;
    }

    // ===== Render: Question =====
    function renderQuestion() {
      const q = questions[state.step];
      const total = questions.length;
      progressWrap.classList.remove('hidden');
      const pct = Math.round(((state.step + 1) / total) * 100);
      progressFill.style.width = pct + '%';
      progressLabel.textContent = `第 ${state.step + 1} 题 / 共 ${total} 题 · Part ${q.part}`;
      progressPercent.textContent = pct + '%';

      let body = '';
      const cur = state.answers[q.id];

      if (q.type === 'text') {
        body = `<div class="field-group">
          <input type="text" id="qInput" placeholder="${q.placeholder || ''}" value="${cur || ''}" oninput="onTextChange(this.value)" maxlength="40">
        </div>`;
      } else if (q.type === 'select') {
        body = `<div class="field-group">
          <select id="qInput" onchange="onTextChange(this.value)">
            <option value="">请选择...</option>
            ${q.options.map(opt => `<option value="${opt}" ${cur===opt?'selected':''}>${opt}</option>`).join('')}
          </select>
        </div>`;
      } else if (q.type === 'yesno') {
        body = `<div class="options">
          <div class="option ${cur==='是'?'selected':''}" onclick="selectOption('是')">
            <div class="option-mark"></div><span>是</span>
          </div>
          <div class="option ${cur==='否'?'selected':''}" onclick="selectOption('否')">
            <div class="option-mark"></div><span>否</span>
          </div>
        </div>`;
      } else if (q.type === 'single') {
        body = `<div class="options">
          ${q.options.map(opt => `
            <div class="option ${cur===opt?'selected':''}" onclick="selectOption('${opt.replace(/'/g,"\\'")}')">
              <div class="option-mark"></div><span>${opt}</span>
            </div>
          `).join('')}
        </div>`;
      } else if (q.type === 'multi') {
        const arr = cur || [];
        body = `<div class="options">
          ${q.options.map(opt => `
            <div class="option option-multi ${arr.includes(opt)?'selected':''}" onclick="toggleMulti('${opt.replace(/'/g,"\\'")}')">
              <div class="option-mark"></div><span>${opt}</span>
            </div>
          `).join('')}
        </div>`;
      } else if (q.type === 'textarea') {
        const val = cur || '';
        body = `<div class="field-group">
          <textarea id="qInput" placeholder="${q.placeholder || ''}" maxlength="${q.maxLen || 500}" oninput="onTextChange(this.value); updateCount(this.value.length, ${q.maxLen || 500})">${val}</textarea>
          <div class="char-count" id="charCount">${val.length} / ${q.maxLen || 500}</div>
        </div>`;
      }

      const isLast = state.step === total - 1;
      const nextLabel = isLast ? '提交并生成诊断书 →' : '下一题 →';
      const optionalTag = q.required === false ? '<span class="q-optional"> · 选填</span>' : '';

      app.innerHTML = `
        <div class="card">
          <div class="q-meta">
            <span class="q-id">${q.id}</span>
            <span class="q-part">Part ${q.part}</span>
          </div>
          <div class="q-title">${q.title}${optionalTag}</div>
          ${q.hint ? `<div class="q-hint">${q.hint}</div>` : ''}
          ${body}
          <div class="nav-buttons">
            ${state.step > 0 ? `<button class="btn btn-secondary" onclick="prev()">← 上一题</button>` : ''}
            <button class="btn btn-primary" id="nextBtn" onclick="next()" ${isValidAnswer(q)?'':'disabled'}>${nextLabel}</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        const inp = document.getElementById('qInput');
        if (inp && (q.type==='text' || q.type==='textarea')) inp.focus();
      }, 60);
    }

    // ===== Render: Loading =====
    function renderLoading(idx) {
      progressWrap.classList.add('hidden');
      const steps = [
        '正在分析你的等级判定…',
        '正在结合你的行业 / 规模做个性化校准…',
        '正在生成跨级路径…',
        '诊断书快好了，再等几秒…'
      ];
      app.innerHTML = `
        <div class="card loading-state">
          <div class="spinner"></div>
          <div class="loading-title">正在为你出诊断书</div>
          <div class="loading-step">${steps[idx % steps.length]}</div>
        </div>
      `;
    }

    // ===== Render: Result =====
    function renderResult() {
      progressWrap.classList.add('hidden');
      const r = state.result;
      app.innerHTML = `
        <div class="card">
          <div class="result-header">
            <div class="result-badge">企业 AI 原生化诊断书</div>
            <div class="result-level-num">Lv.${r.level}</div>
            <div class="result-level-name">${r.levelName}</div>
            <div class="result-level-tagline">${r.tagline || ''}</div>
          </div>

          <div class="result-content">${r.html}</div>

          <div class="result-footer">
            <div class="cta-box">
              <span class="cta-tag">📘 免费领取</span>
              <div class="cta-title">把这份诊断截图发我，<br/>送你一份《企业 AI 化改造白皮书》</div>
              <div class="cta-text">这份诊断书是 AI 实时生成的<strong>通用版</strong>。如果想要 <strong>基于你的等级、行业、卡点</strong> 给一对一的具体建议，加我微信。</div>
              <div class="cta-text">我正在大量收集各行业企业 AI 应用的真实场景和卡点。把你这份诊断截图发我，<strong>我送你一份完整版《企业 AI 化改造白皮书》</strong>，并基于你的具体情况给你 1 条最关键的建议。</div>

              <div class="cta-qr-wrap">
                <img class="cta-qr-img" src="/qrcode.jpg" alt="卿小璐微信" loading="lazy">
                <div class="cta-qr-info">
                  <div class="wechat-label">微信号</div>
                  <div class="wechat-id">qingxiaoluu</div>
                  <div class="wechat-hint">扫码加我，<br/>备注「AI 测评」</div>
                </div>
              </div>
            </div>
            <div class="result-actions">
              <button class="btn btn-primary" onclick="restart()">重新测一遍</button>
              <button class="btn btn-secondary" onclick="copyResult()">复制全文</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderError(msg) {
      progressWrap.classList.add('hidden');
      app.innerHTML = `
        <div class="card">
          <div class="error-banner">${msg}</div>
          <p style="color:var(--text-soft);font-size:14px;margin-bottom:24px;">你的答题数据还在，可以再试一次。如果反复出错，加微信 <strong>qingxiaoluu</strong> 反馈。</p>
          <button class="btn btn-primary btn-large" onclick="submit()">重试生成诊断书</button>
        </div>
      `;
    }

    // ===== Handlers =====
    window.next = function() {
      if (state.step === -1) { state.step = 0; renderQuestion(); return; }
      const q = questions[state.step];
      if (!isValidAnswer(q)) return;
      if (state.step === questions.length - 1) { submit(); }
      else { state.step++; renderQuestion(); }
    };

    window.prev = function() {
      if (state.step > 0) { state.step--; renderQuestion(); }
    };

    window.onTextChange = function(val) {
      const q = questions[state.step];
      state.answers[q.id] = val;
      const btn = document.getElementById('nextBtn');
      if (btn) btn.disabled = !isValidAnswer(q);
    };

    window.updateCount = function(n, max) {
      const el = document.getElementById('charCount');
      if (el) el.textContent = `${n} / ${max}`;
    };

    window.selectOption = function(val) {
      const q = questions[state.step];
      state.answers[q.id] = val;
      if (q.type === 'yesno' || q.type === 'single') {
        setTimeout(() => {
          if (state.step === questions.length - 1) renderQuestion();
          else { state.step++; renderQuestion(); }
        }, 240);
      } else {
        renderQuestion();
      }
    };

    window.toggleMulti = function(val) {
      const q = questions[state.step];
      const arr = state.answers[q.id] || [];
      const i = arr.indexOf(val);
      if (i >= 0) arr.splice(i, 1); else arr.push(val);
      state.answers[q.id] = arr;
      renderQuestion();
    };

    function isValidAnswer(q) {
      const v = state.answers[q.id];
      if (q.required === false) return true;
      if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
      if (q.type === 'textarea') return typeof v === 'string' && v.trim().length >= 5;
      return v !== undefined && v !== null && (typeof v !== 'string' || v.trim().length > 0);
    }

    window.submit = async function() {
      state.step = questions.length;
      let idx = 0;
      renderLoading(0);
      const intv = setInterval(() => { idx++; renderLoading(idx); }, 3500);
      try {
        const resp = await fetch('/api/diagnose', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ answers: state.answers })
        });
        clearInterval(intv);
        if (!resp.ok) {
          const errText = await resp.text();
          throw new Error(`服务返回 ${resp.status}：${errText.slice(0,160)}`);
        }
        const data = await resp.json();
        state.result = data;
        state.step = questions.length + 1;
        renderResult();
      } catch (e) {
        clearInterval(intv);
        renderError('生成诊断书时出了点问题：' + (e.message || '未知错误'));
      }
    };

    window.restart = function() {
      state.step = -1; state.answers = {}; state.result = null;
      renderWelcome();
    };

    window.copyResult = function() {
      const r = state.result;
      const tmp = document.createElement('div');
      tmp.innerHTML = r.html;
      const text = `【企业 AI 原生化诊断书】\n\nLv.${r.level} · ${r.levelName}\n${r.tagline||''}\n\n${tmp.innerText}\n\n— 自然流 · 卿小璐\n微信：qingxiaoluu`;
      navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板'));
    };

    renderWelcome();
  </script>
</body>
</html>
